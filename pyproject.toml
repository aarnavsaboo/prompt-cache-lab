[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-cache-lab"
version = "0.1.0"
requires-python = ">=3.10"

[project.scripts]
prompt-cache-lab = "prompt_cache_lab.__main__:main"

[tool.setuptools.packages.find]
include = ["prompt_cache_lab*"]
